"פאזל של תל אביב. הסקריפט שלי ב-Grasshopper מחלק את התמונה לחלקים משתלבים עם לשוניות ומפיק את קווי החיתוך."
],
"It builds a grid of pieces over the image, then turns every shared edge into a joint with a tab. The direction of each tab is chosen at random from a seed, so the pieces don’t repeat and only fit in one place.": [
"Он строит сетку деталей поверх изображения и превращает каждую общую грань в замок с ушком. Направление каждого ушка выбирается случайно по сиду, поэтому детали не повторяются и встают только на своё место.",
"הוא בונה רשת של חלקים מעל התמונה והופך כל צלע משותפת לחיבור עם לשונית. הכיוון של כל לשונית נבחר באקראי לפי seed, כך שהחלקים לא חוזרים על עצמם ומתאימים רק למקום אחד."
],
